          $outStream = New-Object System.IO.MemoryStream
          $unzip.CopyTo($outStream)
          $bytes = $outStream.ToArray()
          $sha = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '')
          if ($sha -ne '${{ env.PATCH_SHA256 }}') { throw "PATCH FAILED: the embedded patch is damaged (SHA-256 $sha)" }
          $patchFile = Join-Path $PWD 'stability.patch'
          [System.IO.File]::WriteAllBytes($patchFile, $bytes)
          cd pr
          git apply --check $patchFile
          if ($LASTEXITCODE -ne 0) { throw "PATCH FAILED: it does not apply to the pinned PR commit" }
          git apply $patchFile
          if ($LASTEXITCODE -ne 0) { throw "PATCH FAILED" }
          git status --short
          $n = (Select-String -Path plugins/obs-vst3/*.cpp, plugins/obs-vst3/*.h -Pattern 'user build patch' -SimpleMatch).Count
          "patch markers in the source: $n"
          if ($n -lt 35) { throw "PATCH FAILED: too few patch markers ($n)" }

      - name: Inject obs-vst3 into OBS ${{ env.OBS_BRANCH }}
        run: |
          Remove-Item -Recurse -Force obs-studio/plugins/obs-vst3 -ErrorAction SilentlyContinue
          Copy-Item -Recurse pr/plugins/obs-vst3 obs-studio/plugins/obs-vst3
          Copy-Item pr/cmake/finders/FindVST3SDK.cmake obs-studio/cmake/finders/FindVST3SDK.cmake
          Add-Content -Path obs-studio/plugins/CMakeLists.txt -Value "`nadd_obs_plugin(obs-vst3 PLATFORMS WINDOWS MACOS LINUX)" -Encoding ascii
          # NOMINMAX: global in OBS 32.x, missing in 31.x
          Add-Content -Path obs-studio/plugins/obs-vst3/CMakeLists.txt -Value "`ntarget_compile_definitions(obs-vst3 PRIVATE NOMINMAX)" -Encoding ascii

      - name: Get VST3 SDK ${{ env.VST3SDK_TAG }}
        run: |
          git -c advice.detachedHead=false clone --recursive --depth 1 --shallow-submodules --branch ${{ env.VST3SDK_TAG }} https://github.com/steinbergmedia/vst3sdk.git obs-studio/plugins/obs-vst3/sdk
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK clone failed" }
          Select-String -Path obs-studio/plugins/obs-vst3/sdk/pluginterfaces/vst/vsttypes.h -Pattern 'define kVstVersionString' | ForEach-Object { $_.Line.Trim() }

      - name: Configure CMake
        run: |
          cd obs-studio
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_VST3=ON `
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /WX-" `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /GR /WX-" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build (only the obs-vst3 target)
        run: |
          cd obs-studio
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }} --target obs-vst3
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Package (same layout as C:\Program Files\obs-studio)
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force "$out/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$out/data/obs-plugins/obs-vst3" | Out-Null
          $dll = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.dll | Select-Object -First 1
          if (-not $dll) { throw "obs-vst3.dll not found" }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          foreach ($m in @('[obs-vst3 patch] VST3 module loaded once', 'crashed during %s', 'loading the VST3 plug-in again', 'still waiting for the VST3 scan')) {
            if (-not $text.Contains($m)) { throw "DLL check failed, missing: $m" }
          }
          Copy-Item $dll.FullName "$out/obs-plugins/64bit/"
          $pdb = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName "$out/obs-plugins/64bit/" }
          Copy-Item -Recurse "obs-studio/plugins/obs-vst3/data/*" "$out/data/obs-plugins/obs-vst3/"
          Get-ChildItem -Recurse $out | ForEach-Object { $_.FullName }
          Get-FileHash "$out/obs-plugins/64bit/obs-vst3.dll" -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-vst3-saglam-OBS${{ matrix.obs_version }}-windows-x64
          path: package/
          if-no-files-found: error
