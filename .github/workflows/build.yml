name: Build obs-vst3 (OBS PR 12752) for OBS 31.0.3

# Derler: OBS gelistiricisi pkv'nin resmi VST3 PR'indaki (#12752) EN SON obs-vst3 kodunu,
# kullanicinin OBS surumune (31.0.3) gore. ekeer kodu KULLANILMAZ.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_REPO: https://github.com/obsproject/obs-studio.git
  OBS_BRANCH: 31.0.3
  PR_NUMBER: 12752

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Clone OBS Studio ${{ env.OBS_BRANCH }}
        run: |
          git clone --recursive --branch ${{ env.OBS_BRANCH }} ${{ env.OBS_REPO }} obs-studio

      - name: Fetch latest obs-vst3 from OBS PR #${{ env.PR_NUMBER }}
        run: |
          git init pr
          cd pr
          git remote add origin ${{ env.OBS_REPO }}
          git config core.sparseCheckout true
          Set-Content -Path .git/info/sparse-checkout -Value @('/plugins/obs-vst3/', '/cmake/finders/FindVST3SDK.cmake') -Encoding ascii
          git fetch --depth 1 origin "pull/${{ env.PR_NUMBER }}/head"
          git checkout FETCH_HEAD
          git log -1 --format="PR commit: %H | %cd | %an | %s"

      - name: Inject obs-vst3 into OBS ${{ env.OBS_BRANCH }}
        run: |
          Remove-Item -Recurse -Force obs-studio/plugins/obs-vst3 -ErrorAction SilentlyContinue
          Copy-Item -Recurse pr/plugins/obs-vst3 obs-studio/plugins/obs-vst3
          Copy-Item pr/cmake/finders/FindVST3SDK.cmake obs-studio/cmake/finders/FindVST3SDK.cmake
          Add-Content -Path obs-studio/plugins/CMakeLists.txt -Value "`nadd_obs_plugin(obs-vst3 PLATFORMS WINDOWS MACOS LINUX)" -Encoding ascii
          # OBS 31.0.3 does not define NOMINMAX globally (newer OBS does) -> std::max breaks on windows.h macros
          Add-Content -Path obs-studio/plugins/obs-vst3/CMakeLists.txt -Value "`ntarget_compile_definitions(obs-vst3 PRIVATE NOMINMAX)" -Encoding ascii

      - name: Get VST3 SDK
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git obs-studio/plugins/obs-vst3/sdk

      - name: Configure CMake
        run: |
          cd obs-studio
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_VST3=ON `
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /WX-" `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /GR /WX-" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build (only the obs-vst3 target)
        run: |
          cd obs-studio
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }} --target obs-vst3

      - name: Package (same layout as C:\Program Files\obs-studio)
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force "$out/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$out/data/obs-plugins/obs-vst3" | Out-Null
          $dll = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.dll | Select-Object -First 1
          if (-not $dll) { throw "obs-vst3.dll bulunamadi" }
          Copy-Item $dll.FullName "$out/obs-plugins/64bit/"
          $pdb = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName "$out/obs-plugins/64bit/" }
          Copy-Item -Recurse "obs-studio/plugins/obs-vst3/data/*" "$out/data/obs-plugins/obs-vst3/"
          Get-ChildItem -Recurse $out | ForEach-Object { $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-PR12752-OBS31.0.3-windows-x64
          path: package/
          if-no-files-found: error
