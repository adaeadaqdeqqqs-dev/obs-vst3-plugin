name: Build obs-vst3 (OBS PR 12752 + stability patch) for OBS 31.0.4

# obs-vst3 for OBS 31.0.4, built from:
#   - pkv's VST3 host from OBS pull request #12752, pinned to commit PR_COMMIT (the newest version of the PR)
#   - Steinberg VST3 SDK, pinned to tag VST3SDK_TAG (the newest SDK release)
#   - one stability patch (embedded below, checked with SHA-256 before it is applied):
#       * scan wait (no plug-in is loaded while the VST3 scan runs), Waves class-list cache, safe Rescan button
#       * VST2-style lock: a plug-in is never (de)activated or restored while it is processing audio
#       * restartComponent (latency / parameter changes) handled on the UI thread, never from the audio thread
#       * every .vst3 module is loaded once per OBS session and shared (WaveShell: one InitDll, one ExitDll)
#       * crash guard: a plug-in that crashes disables only its own filter, OBS keeps running
#       * a plug-in that fails to load is retried automatically after 3 s and 10 s
#       * invalid samples (NaN/Inf) from a plug-in never reach OBS
#       * saved plug-in settings are never overwritten with defaults when a plug-in rejects them (re-tried at 3 s / 10 s)
#       * Rescan re-reads shell plug-ins (Waves) so newly installed ones appear
#       * scanner never aborts on an unreadable folder or a broken module
#       * Turkish language file included
# Another OBS version: add it to the obs_version list below, e.g. [ '31.0.4', '32.2.2' ].
on:
  workflow_dispatch:
  push:
    branches: [ main, master, vst3-saglam ]
    paths:
      - '.github/workflows/build.yml'

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_REPO: https://github.com/obsproject/obs-studio.git
  PR_NUMBER: 12752
  PR_COMMIT: 39984171fee94ca8661e6544813c8c0358347a4c
  VST3SDK_TAG: v3.8.1_build_84
  PATCH_SHA256: 1B3235AEB0B42738923577A6EA5C0F7774D352556AE508CEFEBCDB2C097B9854

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        obs_version: [ '31.0.4' ]
    env:
      OBS_BRANCH: ${{ matrix.obs_version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Clone OBS Studio ${{ env.OBS_BRANCH }}
        run: |
          git clone --recursive --branch ${{ env.OBS_BRANCH }} ${{ env.OBS_REPO }} obs-studio
          if ($LASTEXITCODE -ne 0) { throw "OBS clone failed" }

      - name: Fetch obs-vst3 from OBS PR ${{ env.PR_NUMBER }} (pinned commit)
        run: |
          git init pr
          cd pr
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin ${{ env.OBS_REPO }}
          git config core.sparseCheckout true
          Set-Content -Path .git/info/sparse-checkout -Value @('/plugins/obs-vst3/', '/cmake/finders/FindVST3SDK.cmake') -Encoding ascii
          git fetch --depth 1 origin ${{ env.PR_COMMIT }}
          if ($LASTEXITCODE -ne 0) { throw "PR commit ${{ env.PR_COMMIT }} could not be fetched" }
          git -c advice.detachedHead=false checkout FETCH_HEAD
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ env.PR_COMMIT }}') { throw "Unexpected PR commit: $head" }
          git log -1 --format="PR commit: %H | %cd | %an | %s"

      - name: Apply the stability patch (SHA-256 checked)
