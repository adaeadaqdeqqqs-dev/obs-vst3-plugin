name: Build obs-vst3 (OBS PR 12752 + scan-wait patch) for OBS 32.2.2 and 31.0.4

# Derler: OBS gelistiricisi pkv'nin resmi VST3 PR'indaki (#12752) EN SON obs-vst3 kodunu,
# iki OBS surumune (32.2.2 ve 31.0.4) ayri ayri gore. ekeer kodu KULLANILMAZ.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_REPO: https://github.com/obsproject/obs-studio.git
  PR_NUMBER: 12752

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        obs_version: [ '32.2.2', '31.0.4' ]
    env:
      OBS_BRANCH: ${{ matrix.obs_version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Clone OBS Studio ${{ env.OBS_BRANCH }}
        run: |
          git clone --recursive --branch ${{ env.OBS_BRANCH }} ${{ env.OBS_REPO }} obs-studio

      - name: Fetch latest obs-vst3 from OBS PR #${{ env.PR_NUMBER }}
        run: |
          git init pr
          cd pr
          git remote add origin ${{ env.OBS_REPO }}
          git config core.sparseCheckout true
          Set-Content -Path .git/info/sparse-checkout -Value @('/plugins/obs-vst3/', '/cmake/finders/FindVST3SDK.cmake') -Encoding ascii
          git fetch --depth 1 origin "pull/${{ env.PR_NUMBER }}/head"
          git checkout FETCH_HEAD
          git log -1 --format="PR commit: %H | %cd | %an | %s"

      - name: Inject obs-vst3 into OBS ${{ env.OBS_BRANCH }}
        run: |
          Remove-Item -Recurse -Force obs-studio/plugins/obs-vst3 -ErrorAction SilentlyContinue
          Copy-Item -Recurse pr/plugins/obs-vst3 obs-studio/plugins/obs-vst3
          Copy-Item pr/cmake/finders/FindVST3SDK.cmake obs-studio/cmake/finders/FindVST3SDK.cmake
          Add-Content -Path obs-studio/plugins/CMakeLists.txt -Value "`nadd_obs_plugin(obs-vst3 PLATFORMS WINDOWS MACOS LINUX)" -Encoding ascii
          # NOMINMAX: global in OBS 32.x, missing in 31.x -> required for the 31.0.4 build, harmless for 32.2.2
          Add-Content -Path obs-studio/plugins/obs-vst3/CMakeLists.txt -Value "`ntarget_compile_definitions(obs-vst3 PRIVATE NOMINMAX)" -Encoding ascii

      - name: Patch - wait for VST3 scan before loading plug-ins (prevents WaveShell startup crash)
        run: |
          $f = "obs-studio/plugins/obs-vst3/obs-vst3.cpp"
          $c = [System.IO.File]::ReadAllText($f)
          $a1 = 'static std::thread vst3ScanThread;'
          $a2 = 'if (!list->getPathById(vst3PluginId).empty()) {'
          if (($c.Split($a1).Count -ne 2) -or ($c.Split($a2).Count -ne 2)) { throw "PATCH FAILED: anchor not found exactly once (PR code changed?)" }
          $helper = @'
          static std::thread vst3ScanThread;

          // [user build patch] Never initialise a VST3 module while the scanner thread may be loading the same module.
          // Shell plug-ins such as Waves' WaveShell crash when two threads run their module init at the same time.
          static void waitForVst3Scan()
          {
          	// No time limit: a plug-in is never loaded while the scan is still running.
          	auto lastLog = std::chrono::steady_clock::now();
          	while (!vst3ScanDone.load(std::memory_order_acquire)) {
          		std::this_thread::sleep_for(std::chrono::milliseconds(20));
          		if (std::chrono::steady_clock::now() - lastLog >= std::chrono::seconds(30)) {
          			blog(LOG_WARNING, "[obs-vst3 patch] still waiting for the VST3 scan to finish before loading plug-ins");
          			lastLog = std::chrono::steady_clock::now();
          		}
          	}
          }
          '@
          $c = $c.Replace($a1, $helper.Trim())
          $c = $c.Replace($a2, "waitForVst3Scan();`n`t`t" + $a2)
          [System.IO.File]::WriteAllText($f, $c, (New-Object System.Text.UTF8Encoding($false)))
          Select-String -Path $f -Pattern "waitForVst3Scan" | ForEach-Object { $_.LineNumber.ToString() + ": " + $_.Line.Trim() }

      - name: Get VST3 SDK
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git obs-studio/plugins/obs-vst3/sdk

      - name: Configure CMake
        run: |
          cd obs-studio
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_VST3=ON `
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /WX-" `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /GR /WX-" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build (only the obs-vst3 target)
        run: |
          cd obs-studio
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }} --target obs-vst3

      - name: Package (same layout as C:\Program Files\obs-studio)
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force "$out/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$out/data/obs-plugins/obs-vst3" | Out-Null
          $dll = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.dll | Select-Object -First 1
          if (-not $dll) { throw "obs-vst3.dll bulunamadi" }
          Copy-Item $dll.FullName "$out/obs-plugins/64bit/"
          $pdb = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName "$out/obs-plugins/64bit/" }
          Copy-Item -Recurse "obs-studio/plugins/obs-vst3/data/*" "$out/data/obs-plugins/obs-vst3/"
          Get-ChildItem -Recurse $out | ForEach-Object { $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-vst3-PR12752-scanwait-OBS${{ matrix.obs_version }}-windows-x64
          path: package/
          if-no-files-found: error
