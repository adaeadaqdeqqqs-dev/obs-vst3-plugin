          zcPlccgibRmKYDEB+rjl/f44waVMlqMeDkN/El8DOJJRFy5KPKujnltjTjc2+WPZbXhGBVbxkgcf
          MFVgWPJlreQrTHjHtVkH6NVLf7ZGAWwtEr/aZplo5Q/+jFwLBsrAeH8pjpPvKZ33V+mp2BHruotb
          8KwOUMZ57w/LPhTPkNzCSpOj1foQAGKLyaxU3k8xwHEwm5VRwlwTSXA3hwft3QAIbtDv9Pc2B0sI
          br6TCqqbb8Z1SKnw8C4nEwJGIwABtohO7Kp8sHLZjtAAJxF/H+jKg3XTgMTXURJUv0yCa3gcqIAU
          ziaJ3JjdCN9dsmx+MplwKcxU1ju2TRucl6j33fnl1cXrV3BU65utdqu9Dg2RVwLJ7OXJ5Xnv29dn
          716e1+pcNWDLA9F8Z9vbNRpRw/4S/41zAPGbpmK9Q+c3Ls+KvEl+laxBKJt1RUIXdsNW+pKuOP8Q
          ZmeTycYL6Phl2E/8hBPie1wyhhL28BS+ieXG3j/5/4s388sOFQEA
          '@
          $gz = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          $inStream = New-Object System.IO.MemoryStream(,$gz)
          $unzip = New-Object System.IO.Compression.GZipStream($inStream, [System.IO.Compression.CompressionMode]::Decompress)
          $outStream = New-Object System.IO.MemoryStream
          $unzip.CopyTo($outStream)
          $bytes = $outStream.ToArray()
          $sha = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '')
          if ($sha -ne $env:PATCH_SHA256) { Fail "PATCH FAILED: the embedded patch is damaged (SHA-256 $sha)" }
          $patchFile = Join-Path $PWD 'stability.patch'
          [System.IO.File]::WriteAllBytes($patchFile, $bytes)
          cd pr
          $eol = if ([System.IO.File]::ReadAllText((Join-Path $PWD 'plugins/obs-vst3/obs-vst3.h')).Contains("`r`n")) { 'CRLF' } else { 'LF' }
          "PR files line endings: $eol"
          $check = git apply --check $patchFile 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail ("PATCH FAILED: it does not apply to the pinned PR commit ($eol): " + $check.Trim()) }
          git apply $patchFile
          if ($LASTEXITCODE -ne 0) { Fail "PATCH FAILED: git apply" }
          git status --short
          $n = (Select-String -Path plugins/obs-vst3/*.cpp, plugins/obs-vst3/*.h -Pattern 'user build patch' -SimpleMatch).Count
          "patch markers in the source: $n"
          if ($n -lt 35) { Fail "PATCH FAILED: too few patch markers ($n)" }

      - name: Inject obs-vst3 into OBS ${{ env.OBS_BRANCH }}
        run: |
          Remove-Item -Recurse -Force obs-studio/plugins/obs-vst3 -ErrorAction SilentlyContinue
          Copy-Item -Recurse pr/plugins/obs-vst3 obs-studio/plugins/obs-vst3
          Copy-Item pr/cmake/finders/FindVST3SDK.cmake obs-studio/cmake/finders/FindVST3SDK.cmake
          Add-Content -Path obs-studio/plugins/CMakeLists.txt -Value "`nadd_obs_plugin(obs-vst3 PLATFORMS WINDOWS MACOS LINUX)" -Encoding ascii
          # NOMINMAX: global in OBS 32.x, missing in 31.x
          Add-Content -Path obs-studio/plugins/obs-vst3/CMakeLists.txt -Value "`ntarget_compile_definitions(obs-vst3 PRIVATE NOMINMAX)" -Encoding ascii

      - name: Get VST3 SDK ${{ env.VST3SDK_TAG }}
        run: |
          git -c advice.detachedHead=false clone --recursive --depth 1 --shallow-submodules --branch ${{ env.VST3SDK_TAG }} https://github.com/steinbergmedia/vst3sdk.git obs-studio/plugins/obs-vst3/sdk
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK clone failed" }
          Select-String -Path obs-studio/plugins/obs-vst3/sdk/pluginterfaces/vst/vsttypes.h -Pattern 'define kVstVersionString' | ForEach-Object { $_.Line.Trim() }

      - name: Configure CMake
        run: |
          cd obs-studio
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_VST3=ON `
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /WX-" `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /GR /WX-" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::CMake configure failed"; throw "CMake configure failed" }

      - name: Build (only the obs-vst3 target)
        run: |
          cd obs-studio
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }} --target obs-vst3 2>&1 | Tee-Object -Variable buildOut | Out-Host
          if ($LASTEXITCODE -ne 0) {
            $buildOut | ForEach-Object { "$_" } | Select-String -Pattern 'error C\d{4}|error LNK\d{4}|fatal error|error MSB\d{4}' |
              Select-Object -First 12 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            throw "Build failed"
          }

      - name: Package (same layout as C:\Program Files\obs-studio)
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force "$out/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$out/data/obs-plugins/obs-vst3" | Out-Null
          $dll = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.dll | Select-Object -First 1
          if (-not $dll) { throw "obs-vst3.dll not found" }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          foreach ($m in @('[obs-vst3 patch] VST3 module loaded once', 'crashed during %s', 'loading the VST3 plug-in again', 'still waiting for the VST3 scan', 'saved plug-in settings restored')) {
            if (-not $text.Contains($m)) { throw "DLL check failed, missing: $m" }
          }
          Copy-Item $dll.FullName "$out/obs-plugins/64bit/"
          $pdb = Get-ChildItem -Recurse obs-studio/build_x64 -Filter obs-vst3.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName "$out/obs-plugins/64bit/" }
          Copy-Item -Recurse "obs-studio/plugins/obs-vst3/data/*" "$out/data/obs-plugins/obs-vst3/"
          Get-ChildItem -Recurse $out | ForEach-Object { $_.FullName }
          Get-FileHash "$out/obs-plugins/64bit/obs-vst3.dll" -Algorithm SHA256 | Format-List

      - name: Publish the package to branch vst3-cikti-OBS${{ matrix.obs_version }}
        run: |
          cd package
          git init -q -b cikti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "obs-vst3 for OBS ${{ matrix.obs_version }} (workflow commit ${{ github.sha }})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/vst3-cikti-OBS${{ matrix.obs_version }}"
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::could not publish the package branch (the artifact below still has it)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-vst3-saglam-OBS${{ matrix.obs_version }}-windows-x64
          path: package/
          if-no-files-found: error
